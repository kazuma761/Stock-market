# MarketPipe — daily stock data pipeline.
#
#   cp .env.example .env    # then paste your Alpha Vantage key
#   docker compose up
#
# Airflow UI: http://localhost:8080

x-airflow-common: &airflow-common
  build: ./docker/airflow
  env_file: .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./core:/opt/airflow/core
    - ./utils:/opt/airflow/utils
    - ./config.json:/opt/airflow/config.json
    - ./tests:/opt/airflow/tests
    # A named volume, not a bind mount: a host ./logs directory would be
    # created root-owned and the airflow user could not write to it, which
    # would cost the evaluator an undocumented `mkdir`/`chown` step.
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # One Postgres instance hosting two databases: `market_data` for the
  # pipeline's rows, and `airflow` (created by init.sql) for orchestrator state.
  postgres:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      # Runs only on first volume creation. `docker compose down -v` to re-apply.
      - ./database_setup/init.sql:/docker-entrypoint-initdb.d/init.sql
    # No host port is published. Everything that needs the database reaches it
    # over the compose network, and `docker compose exec postgres psql ...`
    # works without one -- so publishing it would only create a port collision
    # on machines that already run Postgres.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Market --lastname Pipe --role Admin \
          --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Override AIRFLOW_PORT in .env if 8080 is taken on your machine.
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db-volume:
  airflow-logs:
